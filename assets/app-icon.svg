<!--
  アプリアイコンのマスターデザイン

  「目標きろく」= 達成のチェックマークと、その下に積み上がる記録の行。
  配色は globals.css のミント系テーマ（mint-400 から mint-700）に合わせている。

  ・角丸は付けない（フルブリードの正方形）。
    iOS / Android が OS 側で角丸マスクをかけるため、こちらで丸めると縁が二重になる。
  ・図形は中央 80% の円内に収めている（Android の maskable アイコンの安全領域）。

  この SVG から scripts/generate-icons.mjs で各サイズの PNG を生成する。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6bc795"/>
      <stop offset="1" stop-color="#2e6f4d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 212 L217 279 L362 134" stroke-width="46"/>
    <path d="M168 350 L344 350" stroke-width="26" stroke-opacity="0.65"/>
    <path d="M196 402 L316 402" stroke-width="26" stroke-opacity="0.4"/>
  </g>
</svg>
